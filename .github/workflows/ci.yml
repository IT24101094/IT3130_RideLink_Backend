name: RideLink CI Pipeline

on:
  push:
    branches: [ "main", "master", "dev", "feature/*" ]
  pull_request:
    branches: [ "main", "master", "dev" ]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:latest
        ports:
          - 27017:27017

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'maven'

    - name: Build and Test Account Service
      run: mvn clean test
      working-directory: ./account-service
      env:
        MONGODB_URI: mongodb://localhost:27017/account_db
        MONGO_URI: mongodb://localhost:27017/account_db
        SPRING_DATA_MONGODB_URI: mongodb://localhost:27017/account_db

    - name: Build and Test Driver & Vehicle Service
      run: mvn clean test
      working-directory: ./driver-vehicle-service
      env:
        MONGODB_URI: mongodb://localhost:27017/driver_db
        MONGO_URI: mongodb://localhost:27017/driver_db
        SPRING_DATA_MONGODB_URI: mongodb://localhost:27017/driver_db

    - name: Build and Test Ride Management Service
      run: mvn clean test
      working-directory: ./ride-management-service
      env:
        MONGODB_URI: mongodb://localhost:27017/ride_db
        MONGO_URI: mongodb://localhost:27017/ride_db
        SPRING_DATA_MONGODB_URI: mongodb://localhost:27017/ride_db

    - name: Build and Test Fare & Payment Service
      run: mvn clean test
      working-directory: ./fare-payment-service
      env:
        MONGODB_URI: mongodb://localhost:27017/payment_db
        MONGO_URI: mongodb://localhost:27017/payment_db
        SPRING_DATA_MONGODB_URI: mongodb://localhost:27017/payment_db