name: RideLink CI Pipeline

on:
  push:
    branches: [ "main", "master", "dev", "feature/*" ]
  pull_request:
    branches: [ "main", "master", "dev" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'maven'

    - name: Build and Test Account Service
      run: mvn clean test -Dspring.data.mongodb.uri=mongodb://localhost:27017/account_db
      working-directory: ./account-service

    - name: Build and Test Driver & Vehicle Service
      run: mvn clean test -Dspring.data.mongodb.uri=mongodb://localhost:27017/driver_db
      working-directory: ./driver-vehicle-service

    - name: Build and Test Ride Management Service
      run: mvn clean test -Dspring.data.mongodb.uri=mongodb://localhost:27017/ride_db
      working-directory: ./ride-management-service

    - name: Build and Test Fare & Payment Service
      run: mvn clean test -Dspring.data.mongodb.uri=mongodb://localhost:27017/payment_db
      working-directory: ./fare-payment-service